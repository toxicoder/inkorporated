name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      always: ${{ steps.filter.outputs.always }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'cyborgs/**'
            infra:
              - 'infrastructure/**'
              - 'apps/**'
              - 'config/**'
              - 'tests/**'
              - 'tools/**'
              - 'build/**'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.bazelrc'
              - '.bazelversion'
              - '**/BUILD.bazel'
              - '**/*.bzl'
              - '**/*.sh'
            always:
              - '.github/workflows/**'

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.always == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Prepare the docs virtualenv
        run: bazelisk run //docs:setup-docs
      - name: Strict MkDocs build
        run: bazelisk test //docs:build --test_output=errors

  domain-validation:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.always == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Validate domain configuration
        run: bazelisk test //:validate_domain_config --test_output=errors

  bazel-tests:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.always == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Install the tools the strict lane demands
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint pyyaml
          ansible-galaxy collection install -r infrastructure/ansible/requirements.yml
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kubectl version --client || true
      - name: Install the terraform formatter
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Put the lane tools where a test action can see them
        run: |
          # A Bazel test action gets Bazel's own PATH (/usr/local/bin:/usr/bin:/bin),
          # not the job's, so a tool that lives in the setup-python or
          # setup-terraform tool cache is missing to a lane even though the job
          # shell can run it. //:doctor named the gap; the lanes then failed with
          # "not found but REQUIRE_LINT_TOOLS/CI is set".
          for tool in ansible ansible-doc ansible-lint yamllint terraform; do
            src="$(command -v "${tool}")" || {
              echo "not on the job PATH: ${tool}" >&2
              exit 1
            }
            sudo ln -sfn "${src}" "/usr/local/bin/${tool}"
          done
          /usr/local/bin/terraform version
          /usr/local/bin/ansible-lint --version
          /usr/local/bin/yamllint --version
      - name: Report the host toolchain
        run: bazelisk run //:doctor
      - name: Prove the census from inside a test sandbox
        run: bazelisk test //tools/bazel/sh/test:doctor_test --test_output=errors --nocache_test_results
      - name: Run the gate
        run: bazelisk test //:gate --test_output=errors --nocache_test_results
      - name: Cache Bazel artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '**/BUILD.bazel', '**/*.bzl') }}
