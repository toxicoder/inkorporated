name: CI

# The trunk gate. `bazelisk test //:gate` runs here on every pull request and on every push
# to `main`, the only long-lived branch (docs/guides/git_workflow.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      always: ${{ steps.filter.outputs.always }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'docs-site/**'
              - 'cyborgs/**'
            infra:
              - 'infrastructure/**'
              - 'apps/**'
              - 'config/**'
              - 'tests/**'
              - 'tools/**'
              - 'build/**'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.bazelrc'
              - '.bazelversion'
              - '**/BUILD.bazel'
              - '**/*.bzl'
              - '**/*.sh'
            always:
              - '.github/workflows/**'

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.always == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=5120"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Install the docs toolchain
        # Installs the pinned npm tree from docs-site/package-lock.json plus the PyYAML
        # the roster generator imports, so every lane below runs the same releases.
        run: bazelisk run //docs:setup-docs
      - name: Docs source contract
        # nav.json covers every page, no page carries MkDocs-only syntax, frontmatter
        # parses against the schema the site declares, and the link checker is happy.
        run: bazelisk test //docs:suite --test_output=errors
      - name: Site gates
        # typecheck, the Vitest suite, and the python suites for the nav transcriber,
        # the MkDocs-to-MDX codemod, and the MDX hazard audit.
        run: bazelisk test //docs-site:suite --test_output=errors
      - name: Strict static export
        # Regenerates the cyborg roster, then exports the whole site with the strict
        # flags and fails on a broken link or an unrendered marker.
        run: bazelisk test //docs:build --test_output=errors

  domain-validation:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.always == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Validate domain configuration
        run: bazelisk test //:validate_domain_config --test_output=errors

  bazel-tests:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.always == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Choose the interpreter the lint pins support
        # The pins in tools/bazel/lint-requirements.txt are the releases this tree was
        # cleared against, and that release of ansible predates the image default.
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the tools the strict lane demands
        run: |
          # A Bazel test action is handed Bazel's own PATH (/usr/local/bin:/usr/bin:/bin)
          # and a throwaway HOME, so a lane sees neither the job PATH nor the job's home
          # directory. The tools have to sit where that PATH reaches and resolve their
          # modules without a home to lean on. //:doctor names the gap when one is
          # missing, and the probe in the step after this one reproduces a test action
          # rather than trusting the job shell.
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kubectl version --client || true
          # The prefix is built from the interpreter the pins support rather than the
          # image default: ansible-compat refuses to run ansible-core 2.16 on Python
          # 3.14, so an image-default interpreter installs the wheels and then cannot
          # import them. The version assertion is what turns a silently wrong
          # interpreter into a named failure at install time.
          sudo mkdir -p /opt/gate-tools
          sudo chown "$(id -u):$(id -g)" /opt/gate-tools
          python_binary="$(python3 -c 'import sys; print(sys.executable)')"
          "$python_binary" -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          "$python_binary" -m venv /opt/gate-tools
          /opt/gate-tools/bin/pip install --quiet --upgrade pip
          /opt/gate-tools/bin/pip install --quiet -r tools/bazel/lint-requirements.txt
          /opt/gate-tools/bin/ansible-galaxy collection install \
            -r infrastructure/ansible/requirements.yml
      - name: Install the terraform formatter
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Put the lane tools where a test action can see them
        run: |
          # /usr/local/bin is on the PATH a Bazel test action is handed, so the lane
          # tools are linked there rather than left in a tool cache or in a prefix only
          # the job PATH knows about.
          for tool in ansible ansible-doc ansible-lint yamllint; do
            src="/opt/gate-tools/bin/${tool}"
            [ -x "${src}" ] || {
              echo "the prefix has no ${tool}; see tools/bazel/lint-requirements.txt" >&2
              exit 1
            }
            sudo ln -sfn "${src}" "/usr/local/bin/${tool}"
          done
          src="$(command -v terraform)" || {
            echo "the terraform step left nothing on the job PATH" >&2
            exit 1
          }
          sudo ln -sfn "${src}" /usr/local/bin/terraform
          # Then run each one the way a lane does: Bazel's PATH, an empty environment,
          # and a home directory that does not exist. An install that only works from
          # the job shell is the failure this step exists to catch.
          probe_home="$(mktemp -d)"
          for tool in ansible ansible-doc ansible-lint yamllint terraform; do
            if ! env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="${probe_home}" \
                "/usr/local/bin/${tool}" --version >/dev/null; then
              echo "${tool} cannot run the way a test action sees it" >&2
              exit 1
            fi
          done
      - name: Report the host toolchain
        run: bazelisk run //:doctor
      - name: Prove the census from inside a test sandbox
        run: bazelisk test //tools/bazel/sh/test:doctor_test --test_output=errors --nocache_test_results
      - name: Run the gate
        run: bazelisk test //:gate --test_output=errors --nocache_test_results
      - name: Cache Bazel artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '**/BUILD.bazel', '**/*.bzl') }}
