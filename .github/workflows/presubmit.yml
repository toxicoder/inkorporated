name: Bazel Presubmit Checks

on:
  pull_request:
    branches: [main]

# The quick lane, so a PR gets an early answer. CI.yml runs the whole gate on
# the same event; this job runs //:fast, which is that lane without the slow
# targets, and installs the same host tools the lanes demand.
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Install the tools the strict lane demands
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint pyyaml
          ansible-galaxy collection install -r infrastructure/ansible/requirements.yml
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install the terraform formatter
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Put the lane tools where a test action can see them
        run: |
          # A Bazel test action gets Bazel's own PATH (/usr/local/bin:/usr/bin:/bin),
          # not the job's, so a tool that lives in the setup-python or
          # setup-terraform tool cache is missing to a lane even though the job
          # shell can run it. Keep this list in step with the gate job in ci.yml.
          for tool in ansible ansible-doc ansible-lint yamllint terraform; do
            src="$(command -v "${tool}")" || {
              echo "not on the job PATH: ${tool}" >&2
              exit 1
            }
            sudo ln -sfn "${src}" "/usr/local/bin/${tool}"
          done
          /usr/local/bin/terraform version
          /usr/local/bin/ansible-lint --version
          /usr/local/bin/yamllint --version

      - name: Report the host toolchain
        run: bazelisk run //:doctor

      - name: Run the fast lane
        run: bazelisk test //:fast --test_output=errors --nocache_test_results

      - name: Cache Bazel artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '**/BUILD.bazel', '**/*.bzl') }}
